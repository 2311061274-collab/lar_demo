<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - PetCare</title>
    <link rel="stylesheet" th:href="@{/css/public.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .auth-page-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.12);
            border: 1px solid #E2E8F0;
            overflow: hidden;
            padding: 36px 32px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-icon-badge {
            width: 64px;
            height: 64px;
            background: #EFF6FF;
            color: #0284C7;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.18);
        }

        .auth-title {
            font-size: 22px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: #64748B;
            line-height: 1.5;
        }

        .auth-input-group {
            margin-bottom: 20px;
        }

        .auth-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .auth-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-input-icon {
            position: absolute;
            left: 14px;
            color: #94A3B8;
            font-size: 15px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
            box-sizing: border-box;
        }

        .auth-input:focus {
            border-color: #0284C7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .auth-btn-submit {
            width: 100%;
            padding: 12px;
            background: #0284C7;
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-btn-submit:hover {
            background: #0369A1;
            transform: translateY(-1px);
        }

        .alert-error {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #DC2626;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auth-links {
            margin-top: 24px;
            text-align: center;
            font-size: 13.5px;
            color: #64748B;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .auth-links a {
            color: #0284C7;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body id="top">

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="auth-page-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon-badge">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h1 class="auth-title">Khôi Phục Mật Khẩu</h1>
                <p class="auth-subtitle">
                    Nhập Email, Tên đăng nhập hoặc Số điện thoại của bạn. Chúng tôi sẽ gửi mã OTP 6 số tới Gmail để bạn
                    tạo mật khẩu mới.
                </p>
            </div>

            <!-- ERROR NOTIFICATION -->
            <div th:if="${error}" class="alert-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span th:text="${error}">Thông tin tài khoản không chính xác!</span>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="auth-input-group">
                    <label class="auth-label" for="accountIdentifier">Email / Tên đăng nhập / Số điện thoại</label>
                    <div class="auth-input-wrap">
                        <i class="fa-regular fa-envelope auth-input-icon"></i>
                        <input type="text" id="accountIdentifier" name="accountIdentifier" class="auth-input"
                            th:value="${accountIdentifier}" placeholder="VD: user@gmail.com hoặc 0912345678" required
                            autofocus>
                    </div>
                </div>

                <button type="submit" class="auth-btn-submit">
                    <span>GỬI MÃ XÁC NHẬN</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>

            <div class="auth-links">
                <div>
                    Đã nhớ mật khẩu? <a th:href="@{/login}">Quay lại đăng nhập</a>
                </div>
                <!-- <div>
                <a th:href="@{/}">← Quay về trang chủ</a>
            </div> -->
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
