<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập tài khoản - PetCare</title>
    <link rel="stylesheet" th:href="@{/css/public.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .auth-page-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%);
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.12);
            border: 1px solid #E2E8F0;
            overflow: hidden;
            padding: 36px 32px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo {
            font-size: 32px;
            margin-bottom: 8px;
            display: inline-block;
        }

        .auth-title {
            font-size: 22px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: #64748B;
        }

        .auth-input-group {
            margin-bottom: 18px;
        }

        .auth-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .auth-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-input-icon {
            position: absolute;
            left: 14px;
            color: #94A3B8;
            font-size: 15px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
        }

        .auth-input:focus {
            border-color: #0284C7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .auth-btn-submit {
            width: 100%;
            padding: 12px;
            background: #0284C7;
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-btn-submit:hover {
            background: #0369A1;
            transform: translateY(-1px);
        }

        .auth-links {
            margin-top: 24px;
            text-align: center;
            font-size: 13.5px;
            color: #64748B;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .auth-links a {
            color: #0284C7;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .demo-box {
            margin-top: 24px;
            background: #F8FAFC;
            border: 1px dashed #CBD5E1;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 12.5px;
            color: #475569;
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #DC2626;
        }

        .alert-success {
            background: #ECFDF5;
            border: 1px solid #A7F3D0;
            color: #059669;
        }
    </style>
</head>

<body id="top">

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="auth-page-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-logo">🐾</span>
                <h1 class="auth-title">Đăng Nhập PetCare</h1>
            </div>

            <!-- NOTIFICATIONS -->
            <div th:if="${loginError}" class="alert-box alert-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span th:text="${loginError}">Lỗi đăng nhập</span>
            </div>
            <div th:if="${logoutMessage}" class="alert-box alert-success">
                <i class="fa-solid fa-circle-check"></i>
                <span th:text="${logoutMessage}">Đã đăng xuất</span>
            </div>
            <div th:if="${registeredMessage}" class="alert-box alert-success">
                <i class="fa-solid fa-circle-check"></i>
                <span th:text="${registeredMessage}">Đăng ký thành công</span>
            </div>
            <div th:if="${verifyEmailMessage}"
                style="background: #EFF6FF; border: 1px solid #BFDBFE; color: #1E40AF; padding: 14px 18px; border-radius: 10px; font-size: 13.5px; margin-bottom: 20px; line-height: 1.5; display: flex; align-items: flex-start; gap: 10px;">
                <i class="fa-regular fa-envelope" style="font-size: 20px; margin-top: 2px; color: #2563EB;"></i>
                <div>
                    <strong style="display: block; font-size: 14px; margin-bottom: 2px;">Vui lòng kiểm tra hộp thư
                        Gmail!</strong>
                    <span th:text="${verifyEmailMessage}"></span>
                </div>
            </div>

            <!-- FORM -->
            <form th:action="@{/login}" method="post">
                <div class="auth-input-group">
                    <label class="auth-label" for="username">Tên đăng nhập hoặc Số điện thoại</label>
                    <div class="auth-input-wrap">
                        <i class="fa-regular fa-user auth-input-icon"></i>
                        <input type="text" id="username" name="username" class="auth-input"
                            placeholder="Nhập tên đăng nhập hoặc số điện thoại..." required autofocus>
                    </div>
                </div>

                <div class="auth-input-group">
                    <label class="auth-label" for="password">Mật khẩu</label>
                    <div class="auth-input-wrap">
                        <i class="fa-solid fa-lock auth-input-icon"></i>
                        <input type="password" id="password" name="password" class="auth-input"
                            placeholder="Nhập mật khẩu..." required>
                    </div>
                </div>

                <button type="submit" class="auth-btn-submit">
                    <span>ĐĂNG NHẬP</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-links">
                <div>
                    Chưa có tài khoản? <a href="/register">Đăng ký tài khoản ngay</a>
                </div>
                <div>
                    <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
                </div>
                <!-- <div>
                <a href="/">← Quay về trang chủ</a>
            </div> -->
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
