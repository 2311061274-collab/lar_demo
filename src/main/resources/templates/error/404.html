<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Không tìm thấy trang - PetCare</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #343a40; text-align: center; padding-top: 100px; }
        .error-container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 80px; color: #dc3545; margin: 0; }
        h2 { font-size: 24px; margin-top: 10px; }
        p { color: #6c757d; font-size: 16px; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 10px 20px; color: white; background-color: #0d6efd; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Không tìm thấy trang</h2>
        <p th:text="${errorMessage}">Trang bạn yêu cầu không tồn tại hoặc đã bị xóa.</p>
        <a href="/" class="btn">Quay lại Trang chủ</a>
    </div>
</body>
</html>
