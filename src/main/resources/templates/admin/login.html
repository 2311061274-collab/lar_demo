<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị - PetCare Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-icon">🐾</div>
            <h1>PetCare Admin</h1>
            <p>Hệ thống quản lý bệnh viện thú y chuyên sâu</p>
        </div>

        <div class="login-body">
            
            <div th:if="${param.error}" class="alert alert-error">
                ⚠️ Tên đăng nhập hoặc mật khẩu không chính xác!
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                ✓ Bạn đã đăng xuất an toàn khỏi hệ thống.
            </div>

            <form th:action="@{/admin/login}" method="post">
                
                <div class="form-group">
                    <label class="form-label">Tên đăng nhập quản trị</label>
                    <input type="text" name="username" class="form-control" placeholder="Nhập username (mặc định: admin)..." required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu (mặc định: Admin@123)..." required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding: 13px; font-size: 15px; margin-top: 10px;">
                    ĐĂNG NHẬP HỆ THỐNG 🔐
                </button>
            </form>

            <div class="login-footer">
                <a href="/">← Quay lại trang chủ khách hàng</a>
            </div>
            
        </div>
    </div>

</body>
</html>
